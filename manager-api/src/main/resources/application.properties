# ===========================================
# Application
# ===========================================
spring.application.name=gym-manager

# ===========================================
# Datasource
# ===========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_manager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===========================================
# JPA / Hibernate
# ===========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ===========================================
# Flyway
# ===========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===========================================
# Server
# ===========================================
server.port=${PORT:8080}

# ===========================================
# JWT
# Em produção, defina JWT_SECRET como uma chave
# forte (>=256 bits) via variável de ambiente.
# Nunca comite segredos reais.
# ===========================================
app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-bem-maior-e-secreta-em-producao-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ===========================================
# SpringDoc / Swagger
# ===========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===========================================
# Logging
# ===========================================
logging.level.com.keyone=INFO